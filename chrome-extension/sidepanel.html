<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SimpleNow-Source</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="header">
    <!-- The real SimpleNow wordmark, reproduced as text + the exact brand
         checkmark glyph (same geometry/color as the web app's own Logo
         component) instead of a raster image -- a PNG of the full wordmark
         goes soft at this size; vector text+SVG stays crisp at any zoom. -->
    <div class="brand-lockup">
      <span class="brand-word">
        <span class="brand-word-simple">Simple</span><span class="brand-word-now">N<svg class="brand-check" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="12"/><path d="M27 51 L43 67 L75 33" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>w<span class="brand-underline"></span></span>
      </span>
      <span class="brand-tag">Source</span>
    </div>
  </div>

  <div id="app" class="body">
    <div class="loading">Checking this page…</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
